# The dead man's switch: the Mac's bot cannot report its own dead cable,
# so this watcher — alive on GitHub's runners — reads the beacon gist and
# sends the Telegram alert the Mac cannot (docs/watchdog.md).
name: watchdog
on:
  schedule:
    - cron: "*/15 * * * *" # 4 checks/hour; GitHub may delay a few minutes
  workflow_dispatch:
    inputs:
      simulate_stale_minutes:
        description: "Force the stale-alert path (test); 0 = real check"
        required: false
        default: "0"
        type: string
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Nushell (latest stable — the check script is stable-compatible)
        uses: hustcer/setup-nu@v3
      - name: Watchdog check
        env:
          WATCHDOG_BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}
          WATCHDOG_CHAT_ID: ${{ secrets.WATCHDOG_CHAT_ID }}
        run: nu scripts/watchdog-check.nu --simulate-stale-minutes ${{ inputs.simulate_stale_minutes || '0' }}
