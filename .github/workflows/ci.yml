name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Tests + detekt (Corretto 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25" # daemon AND toolchain: detekt 2.0 runs its workers on any JDK >= 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests + detekt
        run: ./gradlew test detekt
      - name: No manual concurrency in main sources (audit U3 sweep)
        run: |
          # U0's binding rule: no hand-rolled loops/sleeps in production code —
          # cadence and waiting are kap operators. The DEFINITIVE gate will be
          # the detekt rule from kap (in the works); until then this sweep
          # catches the literals. No classified exceptions remain: recorder
          # Main.kt's do{} CLI loop converted to Kap.repeat(Schedule.spaced(...))
          # in the kap-first sweep 2 (3/11) — the deployed agent runs one-shot
          # (launchd owns the cadence) and the dev loop is the schedule's.
          # Audit 8/11 additions: raw sleeps and orphaned async are banned
          # outright (zero hits at audit time); entry-point runBlocking and
          # creation-only bridges stay lawful. The rules grep cannot carry
          # live in docs/audit/concurrency-findings.md: @Volatile never for
          # state=f(state), rethrow CancellationException before every
          # catch-all, no IO under a monitor, renders take an injected clock.
          ! grep -rnE 'while[[:space:]]*\([[:space:]]*true|do[[:space:]]*\{|Thread\.sleep|GlobalScope' modules/*/src/main
      - name: Transport jar smoke
        run: ./gradlew :modules:transport:jar
      - name: Recorder installDist smoke
        run: ./gradlew :modules:recorder:installDist
      - name: Daemon installDist smoke
        run: ./gradlew :modules:daemon:installDist
      - name: Comparator installDist smoke
        run: ./gradlew :modules:comparator:installDist
