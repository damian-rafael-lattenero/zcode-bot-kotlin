name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Tests + detekt (Corretto 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21" # daemon AND toolchain: detekt 1.23 cannot run on JDK >= 24
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests + detekt
        run: ./gradlew test detekt
      - name: Recorder installDist smoke
        run: ./gradlew :modules:recorder:installDist
      - name: Daemon installDist smoke
        run: ./gradlew :modules:daemon:installDist
